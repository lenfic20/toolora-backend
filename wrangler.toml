name = "toolora"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/download"]

[[d1_databases]]
binding = "DB"
database_name = "toolora"
database_id = "PASTE_DATABASE_ID_HERE"

[vars]
# Public value from Google Cloud Console. Leave empty to hide the Google button.
GOOGLE_CLIENT_ID = "889873028509-59ka6sd14jjeeqtrvaitk564a2rs9ns1.apps.googleusercontent.com"
# Public address of the FastAPI downloader, for example https://toolora-api.onrender.com
BACKEND_URL = "https://toolora-backend-thze.onrender.com"
